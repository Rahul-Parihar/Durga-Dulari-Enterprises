name: Frontend - Build & Deploy to EC2

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'Dockerfile'
      - '.github/workflows/**'

  push:
    branches: [main, frontend]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'Dockerfile'
      - '.github/workflows/**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: durga-dulari-production-frontend
  IMAGE_TAG: ${{ github.sha }}
  CONTAINER_NAME: durga-dulari-frontend
  DEPLOY_PATH: /opt/durga-dulari
  NODE_VERSION: '22'

permissions:
  id-token: write
  contents: read

jobs:
  # ── Job 1: Lint & Test ─────────────────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clear Next.js cache
        run: rm -rf .next

      
      - name: Verify package files
        run: |
          pwd
          git rev-parse --show-toplevel
          ls -la
          test -f package.json
          test -f package-lock.json
          node -p "require('./package-lock.json').lockfileVersion"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present


  # ── Job 2: Build, Scan & Push ──────────────────────────────
  build-and-push:
    name: Build, Scan & Push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Set image metadata
        id: meta
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build & Push to ECR
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_WHATSAPP_NUMBER=${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
            NEXT_PUBLIC_PHONE_NUMBER=${{ secrets.NEXT_PUBLIC_PHONE_NUMBER }}
            NEXT_PUBLIC_EMAIL=${{ secrets.NEXT_PUBLIC_EMAIL }}
          cache-from: |
            type=gha
            type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache,mode=max

      - name: Trivy vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Delete vulnerable image from ECR on scan failure
        if: failure() && steps.trivy.outcome == 'failure'
        run: |
          aws ecr batch-delete-image \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${{ env.IMAGE_TAG }} \
            --region ${{ env.AWS_REGION }}

      - name: Install Cosign
        if: success()
        uses: sigstore/cosign-installer@v3.7.0

      # Fix 5: Cosign keyless signing - permissions already set at workflow level
      - name: Sign image with Cosign (keyless)
        if: success()
        run: cosign sign --yes ${{ steps.meta.outputs.image }}
        env:
          COSIGN_EXPERIMENTAL: 1

  # ── Job 3: Deploy ──────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if compose file changed
        id: compose-changed
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="$EVENT_BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi

          if git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            if git diff --name-only "$BASE" HEAD | grep -qx 'docker-compose.prod.yml'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # If the base commit is unavailable, send the current compose file safely.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSM deployment payload
        id: prepare-deploy
        env:
          UPDATE_COMPOSE: ${{ steps.compose-changed.outputs.changed }}
        run: |
          set -euo pipefail

          cat > deploy-ssm.sh <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          cd /opt/durga-dulari
          exec 9>/tmp/durga-dulari-deploy.lock
          flock -n 9 || {
            echo "Another deployment is in progress. Exiting."
            exit 1
          }

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          DEPLOY_META="SHA=${DEPLOY_SHA} | Actor=${DEPLOY_ACTOR} | Time=$(date -u)"
          echo "$DEPLOY_META" >> deployments.log

          PREVIOUS_IMAGE=$(docker inspect \
            --format='{{index .Config.Image}}' \
            "$CONTAINER_NAME" 2>/dev/null || echo "none")
          echo "Previous image: $PREVIOUS_IMAGE"
          echo "New image: $NEW_IMAGE"

          docker pull "$NEW_IMAGE"
          export IMAGE="$NEW_IMAGE" CONTAINER_NAME

          check_health() {
            local container="$1"
            local label="$2"
            local running health
            echo "--- Health check: $label ---"

            for i in $(seq 1 30); do
              running=$(docker inspect --format='{{.State.Running}}' \
                "$container" 2>/dev/null || echo false)

              if [ "$running" = "true" ]; then
                health=$(docker inspect \
                  --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                  "$container" 2>/dev/null || echo unknown)

                if [ "$health" = "healthy" ] || [ "$health" = "no-healthcheck" ]; then
                  if wget -qO- --timeout=5 http://localhost:3000/api/health >/dev/null 2>&1 || \
                     wget -qO- --timeout=5 http://localhost:3000/ >/dev/null 2>&1; then
                    echo "HTTP health check passed."
                    return 0
                  fi
                fi
              fi

              echo "Attempt $i/30: waiting for application health..."
              sleep 2
            done

            echo "Health check failed."
            return 1
          }

          # Do not let a compose error bypass the rollback path; health check decides.
          docker compose -f docker-compose.prod.yml \
            up -d --force-recreate --no-deps frontend || \
            echo "Compose up returned non-zero; checking deployment health."

          if check_health "$CONTAINER_NAME" "new deployment"; then
            echo "DEPLOYED: $DEPLOY_META" >> deployments.log
            docker image prune -f --filter until=72h
            echo "Deployment successful."
            exit 0
          fi

          echo "Deployment failed. Starting rollback."
          docker compose -f docker-compose.prod.yml stop frontend || true
          docker compose -f docker-compose.prod.yml rm -f frontend || true

          if [ "$PREVIOUS_IMAGE" = "none" ]; then
            echo "No previous image available for rollback."
            echo "ROLLBACK_FAILED: $DEPLOY_META" >> deployments.log
            exit 1
          fi

          if ! docker image inspect "$PREVIOUS_IMAGE" >/dev/null 2>&1; then
            docker pull "$PREVIOUS_IMAGE" || {
              echo "ROLLBACK_PULL_FAILED: $DEPLOY_META" >> deployments.log
              exit 1
            }
          fi

          export IMAGE="$PREVIOUS_IMAGE"
          docker compose -f docker-compose.prod.yml \
            up -d --force-recreate --no-deps frontend || \
            echo "Rollback compose command returned non-zero; checking health."

          if check_health "$CONTAINER_NAME" "rollback"; then
            echo "ROLLBACK_OK: $DEPLOY_META" >> deployments.log
            echo "Previous version restored."
          else
            echo "ROLLBACK_FAILED: $DEPLOY_META" >> deployments.log
            exit 1
          fi

          # Return failure so GitHub Actions correctly reports the failed new release.
          exit 1
          REMOTE_SCRIPT

          echo "script_b64=$(base64 -w 0 deploy-ssm.sh)" >> "$GITHUB_OUTPUT"
          if [ "$UPDATE_COMPOSE" = "true" ]; then
            echo "compose_b64=$(base64 -w 0 docker-compose.prod.yml)" >> "$GITHUB_OUTPUT"
          else
            echo "compose_b64=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy through AWS Systems Manager
        env:
          NEW_IMAGE: ${{ needs.build-and-push.outputs.image }}
          DEPLOY_SCRIPT_B64: ${{ steps.prepare-deploy.outputs.script_b64 }}
          COMPOSE_B64: ${{ steps.prepare-deploy.outputs.compose_b64 }}
          UPDATE_COMPOSE: ${{ steps.compose-changed.outputs.changed }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          export AWS_REGION="${{ env.AWS_REGION }}"
          export CONTAINER_NAME="${{ env.CONTAINER_NAME }}"

          python3 <<'PYTHON'
          import json
          import os
          import shlex

          commands = ["mkdir -p /opt/durga-dulari"]

          if os.environ["UPDATE_COMPOSE"].lower() == "true":
              compose = os.environ["COMPOSE_B64"]
              commands.append(
                  "printf '%s' " + shlex.quote(compose) +
                  " | base64 -d > /opt/durga-dulari/docker-compose.prod.yml"
              )

          script_b64 = os.environ["DEPLOY_SCRIPT_B64"]
          exports = {
              "NEW_IMAGE": os.environ["NEW_IMAGE"],
              "AWS_REGION": os.environ["AWS_REGION"],
              "AWS_ACCOUNT_ID": os.environ["AWS_ACCOUNT_ID"],
              "DEPLOY_SHA": os.environ["DEPLOY_SHA"],
              "DEPLOY_ACTOR": os.environ["DEPLOY_ACTOR"],
              "CONTAINER_NAME": os.environ["CONTAINER_NAME"],
          }
          env_prefix = " ".join(
              f"{key}={shlex.quote(value)}" for key, value in exports.items()
          )
          commands.append(
              "printf '%s' " + shlex.quote(script_b64) +
              " | base64 -d > /tmp/durga-dulari-deploy.sh && "
              "chmod 700 /tmp/durga-dulari-deploy.sh && "
              + env_prefix + " bash /tmp/durga-dulari-deploy.sh"
          )

          with open("ssm-parameters.json", "w", encoding="utf-8") as handle:
              json.dump({"commands": commands}, handle)
          PYTHON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-022c734cc8fde1498 \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --comment "Durga Dulari deployment $GITHUB_SHA" \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-022c734cc8fde1498 \
              --region "$AWS_REGION" \
              --query 'Status' --output text 2>/dev/null || echo Pending)

            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-022c734cc8fde1498 \
                  --region "$AWS_REGION" \
                  --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-022c734cc8fde1498 \
                  --region "$AWS_REGION" \
                  --query '[StatusDetails,StandardOutputContent,StandardErrorContent]' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM command completion."
          exit 1

  # ── Job 4: Notify ──────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci, build-and-push, deploy]
    if: always()

    steps:
      - name: Notify Slack - Success
        if: needs.deploy.result == 'success'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "✅ *Deployment Successful* - Durga Dulari Enterprises",
              "attachments": [{
                "color": "good",
                "fields": [
                  { "title": "Repo",        "value": "${{ github.repository }}", "short": true },
                  { "title": "Branch",      "value": "${{ github.ref_name }}",   "short": true },
                  { "title": "SHA",         "value": "${{ github.sha }}",        "short": true },
                  { "title": "Deployed by", "value": "${{ github.actor }}",      "short": true },
                  { "title": "URL", "value": "${{ secrets.NEXT_PUBLIC_SITE_URL }}", "short": false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true

      
      - name: Notify Slack - Failure
        if: |
          needs.ci.result == 'failure' ||
          needs.build-and-push.result == 'failure' ||
          needs.deploy.result == 'failure'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "❌ Deployment Failed - Durga Dulari Enterprises",
              "attachments": [{
                "color": "danger",
                "fields": [
                  { "title": "Repo", "value": "${{ github.repository }}", "short": true },
                  { "title": "SHA", "value": "${{ github.sha }}", "short": true },
                  { "title": "Actor", "value": "${{ github.actor }}", "short": true },
                  { "title": "CI", "value": "${{ needs.ci.result }}", "short": true },
                  { "title": "Build", "value": "${{ needs.build-and-push.result }}", "short": true },
                  { "title": "Deploy", "value": "${{ needs.deploy.result }}", "short": true },
                  { "title": "Logs", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true

        

